name: Publish
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.repository == 'surikaterna/weaver'
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@v1
        with:
          version: bunx changeset version
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          # Repo/org policy can prevent the default GITHUB_TOKEN from creating
          # release PRs. Configure CHANGESETS_TOKEN as a fine-grained PAT or
          # GitHub App installation token with Contents: write and
          # Pull requests: write for this repository.
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_TOKEN }}

      - name: Publish to npm via Trusted Publishing
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          echo "registry=https://registry.npmjs.org/" > "$NPM_CONFIG_USERCONFIG"
          unset NODE_AUTH_TOKEN
          npx changeset publish
        env:
          NODE_AUTH_TOKEN: ""
          NPM_CONFIG_PROVENANCE: "true"
